<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Placement Predictor</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
</head>
<body>

  <!-- Tagda animated background: particle network + shooting stars + glowing orbs -->
  <canvas id="bgParticles"></canvas>
  <div class="orbs" aria-hidden="true">
    <span class="orb orb1"></span>
    <span class="orb orb2"></span>
    <span class="orb orb3"></span>
    <span class="orb orb4"></span>
  </div>

  <!-- Custom neon cursor (sirf desktop par) -->
  <span id="cursorDot" aria-hidden="true"></span>
  <span id="cursorRing" aria-hidden="true"></span>

  <div class="container">
    <div class="glare" aria-hidden="true"></div>

    <!-- AI scan line (predict karte waqt card par sweep karti hai) -->
    <div class="scanline" aria-hidden="true"></div>

    <!-- Header -->
    <header>
      <h1 id="mainTitle">🎯 Placement Predictor</h1>
      <p id="tagline">Apni details bharo aur jano ki placement hogi ya nahi!</p>
      <div class="badge">⚡ AI Powered</div>
    </header>

    <!-- Profile power bar — jitni details utni energy -->
    <div class="charge" aria-hidden="true">
      <span class="charge-label">⚡ Power</span>
      <div class="charge-track"><div class="charge-fill" id="chargeFill"></div></div>
      <span class="charge-pct" id="chargePct">0%</span>
    </div>

    <!-- Form -->
    <form id="predictForm">

      <label>10th Percentage (%)</label>
      <input type="number" id="tenth_percent" min="0" max="100" step="0.1" placeholder="e.g. 85" required />

      <label>12th Percentage (%)</label>
      <input type="number" id="twelfth_percent" min="0" max="100" step="0.1" placeholder="e.g. 80" required />

      <label>CGPA (0 - 10)</label>
      <input type="number" id="cgpa" min="0" max="10" step="0.01" placeholder="e.g. 7.5" required />

      <label>Internships ki sankhya</label>
      <input type="number" id="internships" min="0" max="10" step="1" placeholder="e.g. 1" required />

      <label>Projects ki sankhya</label>
      <input type="number" id="projects" min="0" max="20" step="1" placeholder="e.g. 3" required />

      <label>Aptitude Score (0 - 100)</label>
      <input type="number" id="aptitude_score" min="0" max="100" step="1" placeholder="e.g. 70" required />

      <label>Communication Score (0 - 100)</label>
      <input type="number" id="communication_score" min="0" max="100" step="1" placeholder="e.g. 75" required />

      <label>Work Experience?</label>
      <select id="work_experience">
        <option value="0">No</option>
        <option value="1">Yes</option>
      </select>

      <button type="submit" id="submitBtn">Predict Karo 🔮</button>
    </form>

    <!-- Result yahan dikhega -->
    <div id="result" class="hidden">
      <h2 id="predictionText"></h2>

      <!-- Circular neon gauge -->
      <div class="gauge">
        <svg viewBox="0 0 120 120" aria-hidden="true">
          <defs>
            <linearGradient id="gaugeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#22d3ee" />
              <stop offset="50%" stop-color="#a78bfa" />
              <stop offset="100%" stop-color="#f472b6" />
            </linearGradient>
          </defs>
          <circle class="gauge-bg" cx="60" cy="60" r="52" />
          <circle class="gauge-fill" id="gaugeFill" cx="60" cy="60" r="52" />
        </svg>
        <div id="probText"></div>
      </div>

      <p id="messageText"></p>
    </div>

    <!-- Error message -->
    <div id="error" class="hidden"></div>

  </div>

  <!-- Placement hua to confetti yahan girega -->
  <canvas id="confetti" aria-hidden="true"></canvas>

  <!-- Logout button -->
  <a href="{{ url_for('logout') }}" class="logout-btn">Logout 🚪</a>

  <!-- Credit (corner me neon sign) -->
  <footer class="credit">
    <span>Created by <b>Vikas Yadav</b><i class="sparkle">✦</i></span>
  </footer>

  <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
